<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a38">
  <title>Winter With You ❄️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at top, #354f83, transparent 65%),
        linear-gradient(160deg, #101a38, #1a3158 55%, #080e20);
      background-size: 200% 200%;
      animation: winterGlow 12s ease-in-out infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes winterGlow {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    #snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .flake {
      position: absolute;
      top: -25px;
      color: white;
      animation: snowfall linear infinite;
      opacity: 0.85;
    }

    @keyframes snowfall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(90%, 430px);
      padding: 35px 22px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 28px;
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 50px rgba(0,0,0,.3);
      animation: appear .9s ease, cardFloat 5s ease-in-out 1s infinite;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes cardFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -6px; }
    }

    .snowman {
      display: inline-block;
      font-size: 65px;
      margin-bottom: 15px;
      animation: snowmanDance 3s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(180,225,255,.7));
    }

    @keyframes snowmanDance {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-14px) rotate(5deg); }
    }

    h1 {
      font-size: clamp(24px, 6vw, 32px);
      line-height: 1.4;
      margin-bottom: 15px;
      text-shadow: 0 0 18px rgba(173,216,255,.45);
    }

    .subtitle {
      color: #d9eaff;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 30px;
      padding: 13px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.94);
    }

    #yes {
      color: white;
      background: linear-gradient(135deg, #ff80b5, #ff4f91);
      box-shadow: 0 5px 20px rgba(255,79,145,.35);
    }

    #no {
      color: #23365b;
      background: #f1f7ff;
    }

    #yes:hover, #yes:focus-visible {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 28px rgba(255,79,145,.7);
    }

    #no:hover, #no:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 0 22px rgba(220,240,255,.6);
    }

    .footer {
      margin-top: 25px;
      color: #c5d8f6;
      font-size: 12px;
    }

    /* Màn hình video */
    #scareScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      align-items: center;
      justify-content: center;
    }

    #scareVideo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Cố gắng ẩn thanh điều khiển trên Safari */
    #scareVideo::-webkit-media-controls,
    #scareVideo::-webkit-media-controls-enclosure,
    #scareVideo::-webkit-media-controls-panel,
    #scareVideo::-webkit-media-controls-play-button,
    #scareVideo::-webkit-media-controls-start-playback-button,
    #scareVideo::-webkit-media-controls-timeline,
    #scareVideo::-webkit-media-controls-fullscreen-button {
      display: none !important;
      -webkit-appearance: none;
    }

    /* Nút đóng video */
    #closeScare {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10001;
      padding: 10px 15px;
      color: white;
      background: rgba(40,40,40,.75);
      border: 1px solid rgba(255,255,255,.5);
      font-size: 14px;
    }

    /* Chữ hiện giữa video khi bấm Đóng */
    #closeMessage {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10002;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: white;
      font-size: clamp(25px, 6vw, 42px);
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow:
        0 0 8px #70bfff,
        0 0 18px #4c91ff,
        2px 3px 5px rgba(0,0,0,.9);
      background: transparent;
      pointer-events: none;
      animation: messageAppear .5s ease both;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: scale(.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Thông báo lỗi video */
    #videoError {
      display: none;
      position: absolute;
      z-index: 10000;
      left: 18px;
      right: 18px;
      bottom: 25px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
      background: rgba(30,30,30,.95);
    }

    #retryVideo {
      display: block;
      margin: 12px auto 0;
      color: #18213a;
      background: white;
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div id="snow"></div>

  <main class="card" id="mainCard">
    <div class="snowman">☃️</div>

    <h1>¿Quieres celebrar el invierno conmigo? ❄️</h1>

    <p class="subtitle">
      Una temporada fría, pero más bonita contigo. 🐧💙
    </p>

    <div class="buttons">
      <button id="yes" type="button">Sí 💗</button>
      <button id="no" type="button">No 🙈</button>
    </div>

    <p class="footer">Made with ❄️ and a little bit of magic</p>
  </main>

  <!-- Đặt scare.mp4 cùng thư mục với index.html -->
  <section id="scareScreen">
    <video
      id="scareVideo"
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="./scare.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video.
    </video>

    <button id="closeScare" type="button">✕ Đóng</button>

    <div id="closeMessage">
      KHÔNG ĐÂU BÉ ƠI 💙❄️
    </div>

    <div id="videoError">
      Không phát được video!<br>
      Hãy kiểm tra file <b>scare.mp4</b> đã được tải lên
      GitHub cùng thư mục với index.html chưa.
      <button id="retryVideo" type="button">Thử lại</button>
    </div>
  </section>

  <script>
    // TẠO TUYẾT RƠI
    const snow = document.getElementById("snow");
    const snowSymbols = ["❄", "❅", "❆", "•"];

    for (let i = 0; i < 45; i++) {
      const flake = document.createElement("span");
      flake.className = "flake";
      flake.textContent =
        snowSymbols[Math.floor(Math.random() * snowSymbols.length)];

      flake.style.left = Math.random() * 100 + "%";
      flake.style.fontSize = (8 + Math.random() * 17) + "px";
      flake.style.animationDuration = (5 + Math.random() * 10) + "s";
      flake.style.animationDelay = (-Math.random() * 15) + "s";

      snow.appendChild(flake);
    }

    // LẤY CÁC PHẦN TỬ
    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");
    const scareScreen = document.getElementById("scareScreen");
    const scareVideo = document.getElementById("scareVideo");
    const videoError = document.getElementById("videoError");
    const closeButton = document.getElementById("closeScare");
    const closeMessage = document.getElementById("closeMessage");
    const retryButton = document.getElementById("retryVideo");

    // MỞ VÀ PHÁT VIDEO
    async function playScare() {
      scareScreen.style.display = "flex";
      videoError.style.display = "none";
      closeButton.style.display = "block";
      closeMessage.style.display = "none";

      try {
        scareVideo.pause();
        scareVideo.currentTime = 0;
        await scareVideo.play();
      } catch (error) {
        console.error("Lỗi phát video:", error);
        videoError.style.display = "block";
      }
    }

    yesButton.addEventListener("click", playScare);
    noButton.addEventListener("click", playScare);
    retryButton.addEventListener("click", playScare);

    // KHI BẤM ĐÓNG: GIỮ VIDEO, HIỆN CHỮ Ở GIỮA
    closeButton.addEventListener("click", () => {
      videoError.style.display = "none";
      closeButton.style.display = "none";
      closeMessage.style.display = "flex";
    });

    // BÁO LỖI NẾU VIDEO KHÔNG TẢI ĐƯỢC
    scareVideo.addEventListener("error", () => {
      if (scareScreen.style.display === "flex") {
        videoError.style.display = "block";
      }
    });
  </script>
</body>
</html>
