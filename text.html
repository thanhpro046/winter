
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a38">
  <title>Winter With You ❄️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at top, #334f83 0%, transparent 60%),
        linear-gradient(160deg, #101a38, #182b50 55%, #080e20);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tuyết rơi */
    #snow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .flake {
      position: absolute;
      top: -20px;
      color: white;
      opacity: 0.85;
      animation: fall linear infinite;
      user-select: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    /* Hộp nội dung */
    .card {
      position: relative;
      z-index: 2;
      width: min(90%, 430px);
      padding: 35px 22px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 28px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.25);
      animation: appear 1s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .snowman {
      font-size: 65px;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      50% { transform: translateY(-9px); }
    }

    h1 {
      font-size: clamp(24px, 6vw, 32px);
      line-height: 1.35;
      margin-bottom: 14px;
      text-shadow: 0 0 18px rgba(173,216,255,0.45);
    }

    .subtitle {
      color: #d9eaff;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 13px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.94);
    }

    #yes {
      color: #fff;
      background: linear-gradient(135deg, #ff80b5, #ff4f91);
      box-shadow: 0 5px 20px rgba(255,79,145,0.35);
    }

    #no {
      color: #23365b;
      background: #f1f7ff;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #c5d8f6;
    }

    /* Màn hình phát video hù */
    #scareScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      justify-content: center;
      align-items: center;
    }

    #scareVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #closeScare {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 101;
      padding: 10px 15px;
      color: white;
      background: rgba(40,40,40,0.75);
      border: 1px solid rgba(255,255,255,0.5);
      font-size: 14px;
    }

    #videoError {
      display: none;
      position: absolute;
      z-index: 102;
      left: 20px;
      right: 20px;
      bottom: 25px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      background: rgba(30,30,30,0.9);
    }

    #videoError button {
      margin-top: 10px;
      padding: 10px 18px;
      font-size: 14px;
      color: #18213a;
      background: white;
    }
  </style>
</head>

<body>
  <div id="snow"></div>

  <main class="card" id="mainCard">
    <div class="snowman">☃️</div>

    <h1>¿Quieres celebrar el invierno conmigo? ❄️</h1>

    <p class="subtitle">
      Una temporada fría, pero más bonita contigo. 🐧💙
    </p>

    <div class="buttons">
      <button id="yes" type="button">Sí 💗</button>
      <button id="no" type="button">No 🙈</button>
    </div>

    <p class="footer">Made with ❄️ and a little bit of magic</p>
  </main>

  <!-- Video jumpscare: đặt scare.mp4 cùng thư mục với index.html -->
  <section id="scareScreen" aria-label="Video">
    <video id="scareVideo" playsinline preload="auto">
      <source src="./scare.mp4" type="video/mp4">
      Trình duyệt không hỗ trợ video.
    </video>

    <button id="closeScare" type="button">✕ Đóng</button>

    <div id="videoError">
      Không phát được video. Hãy kiểm tra file
      <strong>scare.mp4</strong> đã được tải lên GitHub chưa.
      <br>
      <button id="retryVideo" type="button">Thử phát lại</button>
    </div>
  </section>

  <script>
    // Tạo tuyết rơi
    const snow = document.getElementById("snow");
    const snowSymbols = ["❄", "❅", "❆", "•"];

    for (let i = 0; i < 45; i++) {
      const flake = document.createElement("span");
      flake.className = "flake";
      flake.textContent =
        snowSymbols[Math.floor(Math.random() * snowSymbols.length)];

      flake.style.left = Math.random() * 100 + "%";
      flake.style.fontSize = (8 + Math.random() * 17) + "px";
      flake.style.animationDuration = (5 + Math.random() * 10) + "s";
      flake.style.animationDelay = (-Math.random() * 15) + "s";

      snow.appendChild(flake);
    }

    // Các thành phần video
    const scareScreen = document.getElementById("scareScreen");
    const scareVideo = document.getElementById("scareVideo");
    const videoError = document.getElementById("videoError");
    const closeScare = document.getElementById("closeScare");

    // Cả hai nút đều mở video
    async function playScare() {
      scareScreen.style.display = "flex";
      videoError.style.display = "none";

      try {
        scareVideo.pause();
        scareVideo.currentTime = 0;
        await scareVideo.play();
      } catch (error) {
        videoError.style.display = "block";
      }
    }

    document.getElementById("yes").addEventListener("click", playScare);
    document.getElementById("no").addEventListener("click", playScare);

    // Thử phát lại nếu gặp lỗi
    document.getElementById("retryVideo").addEventListener("click", () => {
      playScare();
    });

    // Đóng video và trở về trang chính
    function stopScare() {
      scareVideo.pause();
      scareVideo.currentTime = 0;
      scareScreen.style.display = "none";
      videoError.style.display = "none";
    }

    closeScare.addEventListener("click", stopScare);

    // Video kết thúc thì vẫn ở màn hình đen cho đến khi đóng
    scareVideo.addEventListener("error", () => {
      if (scareScreen.style.display === "flex") {
        videoError.style.display = "block";
      }
    });
  </script>
</body>
</html>
